// Top-level build file where you can add configuration options common to all sub-projects/modules.
import static tasks.GetLocalProperties.localProperties

buildscript {
    ext {
        gradle_version = '8.13.1'
        kotlin_version = '2.2.21'
        sentry_plugins_version = '0.0.43'
        about_libraries = "11.2.3"
    }

    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
        maven {
            url uri(project.ext.muditaRepoUrl)
            credentials {
                username = project.ext.muditaUsername
                password = project.ext.muditaPassword
            }
        }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$gradle_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.mudita:sentry-plugins:$sentry_plugins_version"
	    classpath "com.mikepenz.aboutlibraries.plugin:aboutlibraries-plugin:$about_libraries"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }

        def localProperties = localProperties(rootDir)

        def muditaRepoUsername = localProperties.getProperty(
                "mudita_repo_username",
                System.getenv("ARTIFACTORY_USERNAME")
        )
        def muditaRepoPassword = localProperties.getProperty(
                "mudita_repo_password",
                System.getenv("ARTIFACTORY_PASSWORD")
        )

        def muditaRepoUrl = localProperties.getProperty(
                "mudita_nexus_repo_url",
                System.getenv("MUDITA_PRIVATE_REPOSITORY_URL")
        )

        maven {
            url uri(muditaRepoUrl)
            credentials {
                username = muditaRepoUsername?.toString()
                password = muditaRepoPassword?.toString()
            }
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
