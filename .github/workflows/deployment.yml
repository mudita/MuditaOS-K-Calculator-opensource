name: Deployment

on:
  push:
    tags:
      - '*'

jobs:
  deploy:
    name: Deployment
    runs-on: [ Linux ]
    env:
      ARTIFACTORY_URL: ${{secrets.ARTIFACTORY_URL}}
      ARTIFACTORY_USERNAME: ${{secrets.ARTIFACTORY_USERNAME}}
      ARTIFACTORY_PASSWORD: ${{secrets.ARTIFACTORY_PASSWORD}}
      MUDITA_PRIVATE_REPOSITORY_URL: ${{secrets.MUDITA_PRIVATE_REPOSITORY_URL}}
      SENTRY_DSN: ${{secrets.SENTRY_DSN}}
      SENTRY_URL: ${{secrets.SENTRY_URL}}
      SENTRY_ORG: ${{secrets.SENTRY_ORG}}
      SENTRY_PROJECT: ${{secrets.SENTRY_PROJECT}}
      SENTRY_AUTH_TOKEN: ${{secrets.SENTRY_AUTH_TOKEN}}

    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 100

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install requests
        run: pip install requests

      - name: Increment BUILD_NUMBER as VERSION_CODE
        id: version_code
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          VERSION_CODE=$(python3 buildSrc/src/main/kotlin/scripts/bump_build_version.py BUILD_NUMBER)
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "version-code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Verify Version Bump
        run: ./gradlew checkVersion

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Tag Prefix and Map to Build Variant
        run: |
          PREFIX=$(echo $GITHUB_REF | sed 's|refs/tags/\([^\.]*\).*|\1|')
          echo "BUILD_VARIANT=${PREFIX}" >> $GITHUB_ENV
        env:
          GITHUB_REF: ${{ github.ref }}

      - name: Build APK
        run: |
          if [ $BUILD_VARIANT = "development" ]; then
            ./gradlew assembleDebug
          else
            ./gradlew assemble$BUILD_VARIANT
          fi

      - name: Generate changelog
        run: ./gradlew generateChangelog -PtagPrefix=$BUILD_VARIANT

      - name: Deploy to Nexus
        run: ./gradlew uploadApkToNexus -PnexusUsername=${ARTIFACTORY_USERNAME} -PnexusPassword=${ARTIFACTORY_PASSWORD} -PnexusUrl=${ARTIFACTORY_URL} -PtagPrefix=$BUILD_VARIANT
